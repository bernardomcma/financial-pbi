<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Financeiro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #06070a);
    --panel: var(--tg-theme-secondary-bg-color, #0f172a); /* darker slate */
    /* unify palette: derive other panel variables from --panel so all panels share same base */
    --panel-2: color-mix(in srgb, var(--panel) 96%, #000 4%);
    --panel-3: color-mix(in srgb, var(--panel) 94%, #000 6%);
    --text: var(--tg-theme-text-color, #f4f4f5);
    --muted: var(--tg-theme-hint-color, #a1a1aa);
    --line: color-mix(in srgb, var(--muted) 28%, transparent);
    --accent: #10b981;
    --accent-2: #34d399;
    --danger: #ef4444;
    --warn: #f59e0b;
    --radius: 0px;
    --radius-sm: 0px;
    --sidebar-w: 292px;
    --content-max: 760px;
    --shadow: 0 1px 0 rgba(255,255,255,0.02), 0 6px 18px rgba(0,0,0,0.28);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    background:
      radial-gradient(circle at top left, rgba(16,185,129,0.08), transparent 24%),
      radial-gradient(circle at bottom right, rgba(255,255,255,0.04), transparent 28%),
      var(--bg);
  }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: transparent; color: var(--text);
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px; line-height: 1.45;
  }
  body {
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: linear-gradient(to right, rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.22), transparent 82%);
  }
  a { color: inherit; text-decoration: none; }
  button, input, select, textarea { font: inherit; }
  #app {
    min-height: 100vh;
  }
  .shell {
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    min-height: 100vh;
  }
  .sidebar {
    position: sticky;
    top: 0;
    align-self: start;
    height: 100vh;
    overflow: auto;
    padding: 20px 16px 18px;
    background: linear-gradient(180deg, rgba(0,0,0,0.04), transparent 24%), var(--panel);
    border-right: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 8px 8px 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 16px;
  }
  .brand-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand-title {
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .brand-name {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  .brand-desc {
    color: var(--muted);
    font-size: 13px;
    max-width: 28ch;
  }
  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    width: fit-content;
    padding: 7px 10px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .status-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 999px;
    box-shadow: 0 0 0 4px rgba(16,185,129,0.14);
  }
  .nav-group {
    display: grid;
    gap: 8px;
    margin-top: 14px;
  }
  .nav-label {
    padding: 0 8px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .nav-button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
    color: var(--text);
    padding: 12px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-align: left;
    transition: border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .nav-button:hover { background: rgba(255,255,255,0.04); border-color: rgba(16,185,129,0.28); }
  .nav-button.active { border-color: rgba(16,185,129,0.62); background: rgba(16,185,129,0.08); }
  .nav-button .left {
    display: flex; align-items: center; gap: 10px; min-width: 0;
  }
  .nav-button .icon { font-size: 18px; width: 20px; text-align: center; flex: 0 0 auto; }
  .nav-button .label { font-weight: 600; }
  .nav-button .meta {
    color: var(--muted);
    font-size: 12px;
    flex: 0 0 auto;
  }
  .sidebar-footer {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    display: grid;
    gap: 8px;
  }
  .content {
    min-width: 0;
    padding: 24px 24px 96px;
  }
  .content-inner {
    max-width: var(--content-max);
    margin: 0 auto;
  }
  .hero {
    display: grid;
    gap: 14px;
    padding: 20px 20px 18px;
    border: 1px solid color-mix(in srgb, var(--line) 70%, transparent 30%);
    background: linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0.02)), var(--panel);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .eyebrow {
    color: var(--accent-2);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .title {
    font-size: clamp(26px, 4vw, 38px);
    line-height: 1.02;
    font-weight: 700;
    letter-spacing: -0.04em;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    max-width: 60ch;
    margin: 0;
  }
  /* hero-grid removed: internal debug stats hidden from end user */
  .card {
    border: 1px solid color-mix(in srgb, var(--line) 60%, transparent 40%);
    background: var(--panel);
    border-radius: var(--radius-sm);
    padding: 18px 18px 20px;
    box-shadow: var(--shadow);
    animation: fadeIn .18s ease-out;
  }
  .section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .section-title .headline {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .section-title .subhead {
    color: var(--muted);
    font-size: 12px;
    text-align: right;
  }
  .field {
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  input, select, textarea {
    width: 100%; padding: 14px 14px; font-size: 15px;
    background: var(--panel-3);
    color: var(--text);
    border: 1px solid color-mix(in srgb, var(--line) 84%, transparent 16%);
    border-radius: 6px;
    outline: none; appearance: none; -webkit-appearance: none;
    font-family: inherit;
    transition: border-color .15s ease, background .15s ease, box-shadow .12s ease;
  }
  input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 56%, #fff 44%); }
  input:focus, select:focus, textarea:focus {
    border-color: rgba(16,185,129,0.92);
    background: color-mix(in srgb, var(--panel-3) 74%, #000 26%);
    box-shadow: 0 6px 18px rgba(16,185,129,0.06);
  }
  textarea {
    min-height: 146px; resize: vertical; font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; font-size: 13px;
  }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat: no-repeat; background-position: right 14px center; padding-right: 40px;
  }
  .row { display: flex; gap: 12px; }
  .row > .field { flex: 1; }
  .hint-line { color: var(--muted); font-size: 12px; margin: -6px 0 14px; padding-left: 2px; }
  .list-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px; background: var(--panel-3); border-radius: var(--radius-sm);
    margin-bottom: 10px; cursor: pointer; border: 1px solid var(--line);
    transition: border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .list-item:hover { border-color: rgba(16,185,129,0.34); background: color-mix(in srgb, var(--panel-3) 78%, #000 22%); }
  .list-item.sel { border-color: rgba(16,185,129,0.82); background: rgba(16,185,129,0.08); }
  .list-item .emoji { font-size: 20px; }
  .list-item .info { flex: 1; min-width: 0; }
  .list-item .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-item .meta { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty, .error, .loading {
    border: 1px dashed var(--line);
    background: rgba(255,255,255,0.015);
    border-radius: var(--radius-sm);
    padding: 28px 20px;
    text-align: center;
    color: var(--muted);
  }
  .empty .icon, .error .icon, .loading .icon { font-size: 28px; display: block; margin-bottom: 10px; }
  .error { color: #fca5a5; border-color: rgba(239,68,68,0.35); background: rgba(239,68,68,0.06); }
  .loading {
    text-align: left;
    display: grid;
    gap: 10px;
  }
  .skeleton {
    height: 14px;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.13), rgba(255,255,255,0.04));
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite linear;
  }
  .skeleton.w40 { width: 40%; }
  .skeleton.w60 { width: 60%; }
  .skeleton.w75 { width: 75%; }
  .toggle-badge {
    font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px;
    border: 1px solid currentColor; white-space: nowrap;
  }
  .on { background: rgba(16,185,129,.12); color: #6ee7b7; }
  .off { background: rgba(161,161,170,.12); color: #d4d4d8; }
  .mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  .mobile-nav { display: none; }
  .footer-actions {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 18px;
    color: var(--muted);
    font-size: 12px;
  }
  @keyframes shimmer {
    0% { background-position: 0% 0%; }
    100% { background-position: -200% 0%; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 980px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar {
      position: relative;
      height: auto;
      border-right: 0;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }
    .content { padding: 18px 14px calc(88px + env(safe-area-inset-bottom)); }
    .content-inner { max-width: 100%; }
    .hero-grid { grid-template-columns: 1fr; }
    .mobile-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .sidebar .nav-group { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sidebar .nav-label, .sidebar .sidebar-footer { display: none; }
    .nav-button { padding: 10px 10px; }
  }
  @media (max-width: 640px) {
    html, body { font-size: 18px; }
    .hero, .card { padding: 18px; }
    .hero { gap: 18px; }
    .section-title { flex-direction: column; align-items: flex-start; gap: 8px; }
    .section-title .subhead { text-align: left; font-size: 14px; }
    .row { flex-direction: column; gap: 12px; }
    .sidebar { padding: 16px 12px 12px; }
    .brand { padding: 6px 6px 16px; }
    .brand-name { font-size: 20px; }
    .nav-button { padding: 12px 12px; font-size: 16px; }
    .nav-button .label { font-size: 16px; }
    .nav-button .icon { font-size: 20px; }
    .nav-button .meta { display: none; }
    .title { font-size: 28px; }
    .subtitle { font-size: 15px; }
    label { font-size: 13px; }
    input, select, textarea { font-size: 16px; padding: 16px; }
    .field { margin-bottom: 18px; }
    .card { padding-bottom: 22px; }
    .content { padding-bottom: calc(160px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// Initialize Telegram WebApp bridge if available. When opening locally (file://)
// create a lightweight mock so we can test MainButton hide/show behavior.
let tg = window.Telegram ? window.Telegram.WebApp : null;
const _localMock = !tg && location.protocol === 'file:';
if (_localMock){
  tg = {
    MainButton: {
      _visible: false,
      _enabled: true,
      setText(text){ this.text = text; console.log('MainButton.setText', text); },
      show(){ this._visible = true; document.body.dataset.tgMainVisible = '1'; console.log('MainButton.show'); },
      hide(){ this._visible = false; document.body.dataset.tgMainVisible = '0'; console.log('MainButton.hide'); },
      enable(){ this._enabled = true; console.log('MainButton.enable'); },
      disable(){ this._enabled = false; console.log('MainButton.disable'); },
      onClick(fn){ this._click = fn; window._mockTgMainClick = fn; }
    },
    sendData(payload){ console.log('tg.sendData', payload); alert('Mock sendData:\n'+payload); },
    close(){ console.log('tg.close'); },
    ready(){ console.log('tg.ready'); },
    expand(){ console.log('tg.expand'); },
    HapticFeedback: { notificationOccurred(){ /* noop */ } },
    showAlert(msg){ alert('Alert: '+msg); }
  };
  // expose the mock for debug/testing in file:// context
  window.__tg = tg;
}
// If we're running from file:// create a tiny visual MainButton shim and
// wrap existing `tg.MainButton` methods so focus/blur can be tested locally.
if (location.protocol === 'file:'){
  try {
    const mainUi = document.createElement('div');
    mainUi.id = '__tg_main_ui';
    mainUi.style.cssText = 'position:fixed;right:16px;bottom:18px;padding:12px 14px;background:var(--accent);color:#042018;border-radius:12px;font-weight:700;box-shadow:0 8px 24px rgba(2,6,23,0.6);z-index:99999;display:none;align-items:center;gap:8px';
    mainUi.textContent = 'Enviar';
    document.body.appendChild(mainUi);
    if (tg && tg.MainButton){
      const orig = { show: tg.MainButton.show?.bind(tg.MainButton), hide: tg.MainButton.hide?.bind(tg.MainButton), setText: tg.MainButton.setText?.bind(tg.MainButton) };
      tg.MainButton.show = () => { try{ if (orig.show) orig.show(); }catch(e){} mainUi.style.display = 'flex'; document.body.dataset.tgMainVisible = '1'; };
      tg.MainButton.hide = () => { try{ if (orig.hide) orig.hide(); }catch(e){} mainUi.style.display = 'none'; document.body.dataset.tgMainVisible = '0'; };
      tg.MainButton.setText = (t) => { try{ if (orig.setText) orig.setText(t); }catch(e){} mainUi.textContent = t; };
    }
  } catch(e) { /* ignore */ }
}

/* ---- Constantes canonicas (espelham ui/constants.py + ai_parser) ---- */
const CATEGORIAS = ["Vestuário","Comida","iFood","Lazer","Saúde","Presentes","Utilidades",
  "Eletrônicos","Moradia","Transporte","Educação","Assinaturas","Viagem","Bebidas","Outros"];
const CATEGORIAS_RECEITA = ["Trabalho","Pix Avulso"];
const CARTOES = ["Inter","Nubank","MercadoPago","PicPay","AmazonPrime"];
const CONTAS  = ["Inter","Nubank","MercadoPago","PicPay","Dinheiro"];
const PRIORIDADES = ["Baixa","Media","Alta"];
const PERIODICIDADES = ["Mensal","Anual"];
const CLASSES_INVESTIMENTO = ["CDI","Cripto","ETF","Acao"];

const app = document.getElementById("app");
let appState = {
  screen: "painel",
  title: "",
  subtitle: "",
  type: "form",
  section: "operacoes",
};

/* ---- Helpers ---- */
function h(html){ app.innerHTML = html; }
function el(id){ return document.getElementById(id); }
function opts(list, sel){
  return list.map(o => `<option value="${o}"${o===sel?" selected":""}>${o}</option>`).join("");
}
function header(emoji, titulo, sub){
  return `<h1 class="title">${emoji} ${titulo}</h1>` +
         (sub ? `<p class="subtitle">${sub}</p>` : "");
}
function field(label, inner){ return `<div class="field"><label>${label}</label>${inner}</div>`; }

const NAV = {
  receita: { emoji: "🟢", label: "Receita", meta: "entrada", group: "operacoes" },
  debito: { emoji: "🔴", label: "Débito", meta: "saída", group: "operacoes" },
  cartao: { emoji: "💳", label: "Cartão", meta: "crédito", group: "operacoes" },
  pix: { emoji: "🔁", label: "PIX", meta: "parcelado", group: "operacoes" },
  wishlist: { emoji: "⭐", label: "Wishlist", meta: "desejos", group: "cadastro" },
  invest: { emoji: "📈", label: "Investimento", meta: "aporte", group: "cadastro" },
  assinatura: { emoji: "🔔", label: "Assinatura", meta: "recorrente", group: "cadastro" },
  fatura: { emoji: "📅", label: "Fatura", meta: "cartão", group: "manutencao" },
  pixedit: { emoji: "🔁", label: "PIX Editar", meta: "ajuste", group: "manutencao" },
  asstoggle: { emoji: "🔄", label: "Ass. On/Off", meta: "toggle", group: "manutencao" },
  sql: { emoji: "🗄️", label: "SQL", meta: "avançado", group: "admin" },
};

function screenMeta(screen){
  return NAV[screen] || NAV.receita;
}

function formatCount(n){
  if (n >= 1000) return "999+";
  return String(n);
}

function loadingState(title, subtitle){
  return `
    <div class="card loading" aria-busy="true" aria-live="polite">
      <div class="skeleton w40"></div>
      <div class="skeleton w75"></div>
      <div class="skeleton w60"></div>
      <div class="skeleton w75"></div>
      <div class="skeleton w40"></div>
      <div class="skeleton w60"></div>
    </div>`;
}

function emptyState(icon, title, text){
  return `
    <div class="empty" role="status">
      <span class="icon">${icon}</span>
      <strong style="display:block;color:var(--text);margin-bottom:6px;">${title}</strong>
      <div>${text}</div>
    </div>`;
}

function errorState(icon, title, text){
  return `
    <div class="error" role="alert">
      <span class="icon">${icon}</span>
      <strong style="display:block;color:#fecaca;margin-bottom:6px;">${title}</strong>
      <div>${text}</div>
    </div>`;
}

function renderShell(mainHtml){
  const active = appState.screen;
  const buttons = Object.entries(NAV).map(([screen, item]) => `
    <button class="nav-button${screen===active?" active":""}" data-screen="${screen}" type="button">
      <span class="left"><span class="icon">${item.emoji}</span><span class="label">${item.label}</span></span>
      <span class="meta">${item.meta}</span>
    </button>`).join("");
  // internal counts removed from public UI
  const label = screenMeta(active);
  h(`
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-top">
            <div>
              <div class="brand-title">Painel financeiro</div>
              <div class="brand-name">Ledger UI</div>
            </div>
            <div class="status-chip"><span class="status-dot"></span> pronto</div>
          </div>
          <div class="brand-desc">Interface minimalista para registrar, revisar e ajustar movimentações sem ruído visual.</div>
        </div>
        <div class="nav-label">Ações rápidas</div>
        <div class="nav-group">${buttons}</div>
        <div class="sidebar-footer">
          <div>Layout adaptativo com navegação fixa no desktop e grade compacta no mobile.</div>
          <div>Valores usam tipografia tabular para facilitar leitura e comparação.</div>
        </div>
      </aside>
      <main class="content">
        <div class="content-inner">
          <section class="hero">
            <div class="eyebrow">${label.group}</div>
            ${header(label.emoji, appState.title || label.label, appState.subtitle || "")}
            <!-- internal stats removed -->
          </section>
          <section class="card">
            <div class="section-title">
              <div class="headline">${label.label}</div>
              <div class="subhead">${appState.type === "list" ? "Estados de lista tratados" : "Validação em linha e feedback imediato"}</div>
            </div>
            ${mainHtml}
            <div class="footer-actions">
              <span>${appState.section === "admin" ? "Dados avançados" : "Fluxo principal"}</span>
              <span class="mono">${tg ? "WebApp.sendData" : "alert fallback"}</span>
            </div>
          </section>
        </div>
      </main>
    </div>`);
  document.querySelectorAll("[data-screen]").forEach(btn => {
    btn.onclick = () => {
      location.hash = `#${btn.getAttribute("data-screen")}`;
    };
  });
}

function renderScreen(kind, title, subtitle, mainHtml, section){
  appState = { ...appState, type: kind, title, subtitle, section };
  renderShell(mainHtml);
}

function decodePayload(){
  // Le dados injetados pelo bot no fragmento: #screen?d=<urlsafe_base64(json)>
  const raw = location.hash.slice(1);
  const q = raw.indexOf("?");
  const screen = q >= 0 ? raw.slice(0, q) : raw;
  let data = null;
  let parseError = false;
  if (q >= 0){
    const params = new URLSearchParams(raw.slice(q + 1));
    const d = params.get("d");
    if (d){
      try {
        let s = d.replace(/-/g,"+").replace(/_/g,"/");
        while (s.length % 4) s += "=";
        const bin = atob(s);
        const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
        data = JSON.parse(new TextDecoder("utf-8").decode(bytes));
      } catch(e){
        data = null;
        parseError = true;
      }
    }
  }
  return { screen: screen || "painel", data, parseError };
}

let submitFn = null;
function setSubmit(text, fn){
  submitFn = fn;
  if (!tg){ return; }
  tg.MainButton.setText(text);
  tg.MainButton.show();
  tg.MainButton.enable();
}
function send(obj){
  const json = JSON.stringify(obj);
  if (tg){ tg.sendData(json); tg.close(); }
  else { alert("Fora do Telegram:\n" + json); }
}
function fail(msg){
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
  if (tg) tg.showAlert(msg); else alert(msg);
}
function num(v){ return String(v == null ? "" : v).trim(); }
function setSubmitDisabled(disabled){
  if (!tg){ return; }
  if (disabled){
    tg.MainButton.disable();
  } else {
    tg.MainButton.enable();
  }
}

function telaPixEditar(data){
  const compras = Array.isArray(data) ? data : [];
  if (!compras.length){
    renderScreen("list", "Editar PIX", "Nenhuma compra PIX encontrada", emptyState("📭", "Sem compras PIX", "Não há compras parceladas via PIX para editar agora."), "manutencao");
    return;
  }
  let selId = null;
  const lista = compras.map(c => `
    <div class="list-item" data-id="${c.id}">
      <div class="info">
        <div class="name">#${c.id} · ${c.descricao}</div>
        <div class="meta mono">Total R$ ${c.valor} · ${c.pagas} pagas</div>
      </div>
    </div>`).join("");
  renderScreen("list", "Editar PIX", "Escolha a compra e informe as parcelas pagas",
    lista +
    field("Novo total de parcelas pagas", `<input id="qtd" inputmode="numeric" placeholder="Ex: 3">`), "manutencao");
  document.querySelectorAll(".list-item").forEach(node => {
    node.onclick = () => {
      document.querySelectorAll(".list-item").forEach(n => n.classList.remove("sel"));
      node.classList.add("sel");
      selId = node.getAttribute("data-id");
    };
  });
  setSubmit("💾 Atualizar parcelas", () => {
    if (!selId) return fail("Selecione uma compra PIX.");
    if (!num(el("qtd").value)) return fail("Informe as parcelas pagas.");
    send({action:"pix_editar", id:selId, qtd:el("qtd").value});
  });
}

function telaAssToggle(data){
  const assinaturas = Array.isArray(data) ? data : [];
  if (!assinaturas.length){
    renderScreen("list", "Ativar / Desativar", "Nenhuma assinatura encontrada", emptyState("📭", "Sem assinaturas", "Cadastre uma assinatura antes de alternar o estado."), "manutencao");
    return;
  }
  let sel = null;
  const lista = assinaturas.map(a => `
    <div class="list-item" data-id="${a.id}" data-nome="${encodeURIComponent(a.nome)}" data-ativa="${a.ativa?1:0}">
      <div class="emoji">${a.ativa ? "🟢" : "⚪"}</div>
      <div class="info">
        <div class="name">${a.nome}</div>
        <div class="meta mono">R$ ${a.valor}</div>
      </div>
      <div class="toggle-badge ${a.ativa?"on":"off"}">${a.ativa ? "Ativa" : "Inativa"}</div>
    </div>`).join("");
  renderScreen("list", "Ativar / Desativar", "Toque para alternar o estado da assinatura", lista, "manutencao");
  document.querySelectorAll(".list-item").forEach(node => {
    node.onclick = () => {
      document.querySelectorAll(".list-item").forEach(n => n.classList.remove("sel"));
      node.classList.add("sel");
      sel = node;
      const ativa = node.getAttribute("data-ativa") === "1";
      setSubmit(ativa ? "⚪ Desativar assinatura" : "🟢 Ativar assinatura", enviar);
    };
  });
  function enviar(){
    if (!sel) return fail("Selecione uma assinatura.");
    const ativaAtual = sel.getAttribute("data-ativa") === "1";
    send({action:"ass_toggle", id:sel.getAttribute("data-id"),
      nome:decodeURIComponent(sel.getAttribute("data-nome")), ativa:!ativaAtual});
  }
}

// Hide the Telegram MainButton while inputs are focused (mobile UX).
document.addEventListener('focusin', (e) => {
  const t = e.target;
  if (!t || !t.tagName) return;
  const tag = t.tagName.toUpperCase();
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT'){
    try { if (tg && tg.MainButton && tg.MainButton.hide) tg.MainButton.hide(); } catch(e){}
  }
});
document.addEventListener('focusout', (e) => {
  const t = e.target;
  if (!t || !t.tagName) return;
  const tag = t.tagName.toUpperCase();
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT'){
    try { if (tg && tg.MainButton && tg.MainButton.show && submitFn) tg.MainButton.show(); } catch(e){}
  }
});
// Ensure touch/clicks on inputs also hide the MainButton in some webviews.
document.addEventListener('pointerdown', (e) => {
  const t = e.target;
  if (!t || !t.tagName) return;
  const tag = t.tagName.toUpperCase();
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT'){
    try { if (tg && tg.MainButton && tg.MainButton.hide) tg.MainButton.hide(); } catch(e){}
  }
});

function boot(){
  setSubmitDisabled(true);
  if (tg){ tg.ready(); tg.expand(); }
  const { screen, data, parseError } = decodePayload();
  appState.screen = screen || "receita";
  if (parseError){
    renderScreen(
      "error",
      "Falha ao abrir a tela",
      "O payload enviado pelo bot está inválido.",
      errorState(
        "⚠️",
        "Não foi possível carregar os dados",
        "Tente abrir a tela novamente. Se o problema persistir, o bot pode ter enviado um payload corrompido."
      ),
      "admin"
    );
    return;
  }
  const rota = ROTAS[screen] || telaReceita;
  rota(data);
  if (tg){
    tg.MainButton.onClick(() => { if (submitFn) submitFn(); });
  }
}
boot();
window.addEventListener("hashchange", boot);
</script>
